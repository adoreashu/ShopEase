name: ShopEase QA Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Start Backend Application
      run: |
        cd backend
        ./mvnw clean spring-boot:run &
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Start Frontend Application
      run: |
        cd frontend
        python -m http.server 3000 &

    - name: Wait for Backend
      run: |
        timeout 60 bash -c 'until curl -s http://localhost:8080/api/products; do sleep 2; done'

    - name: Wait for Frontend
      run: |
        timeout 30 bash -c 'until curl -s http://localhost:3000/index.html; do sleep 2; done'

    - name: Run QA Automation Suite
      run: |
        cd automation
        cp -r ../backend/.mvn . || true
        ../backend/mvnw clean test
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Generate Allure Report
      if: always()
      run: |
        cd automation
        ../backend/mvnw allure:report

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: automation/allure-results
        retention-days: 7
