<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">ShopEase</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <!-- Dynamic auth links -->
                    <li class="nav-item"><a class="nav-link" href="login.html" data-testid="nav-login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html" data-testid="nav-register">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html" data-testid="nav-cart">Cart (<span id="cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Hero Banner -->
        <div class="p-5 mb-5 hero-banner text-center shadow-sm">
            <div class="container-fluid py-4">
                <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill mb-3">🔥 Great Deals Every Day</span>
                <h1 class="display-5 fw-bold text-dark">Welcome to ShopEase</h1>
                <p class="col-md-8 mx-auto fs-5 text-muted">Discover the latest electronics, gadgets, and tech essentials with fast delivery.</p>
                <a href="products.html" class="btn btn-primary btn-lg px-4 rounded-pill shadow-sm" data-testid="shop-now-btn">
                    <i class="bi bi-bag-check me-1"></i> Shop All Products
                </a>
            </div>
        </div>

        <!-- Featured Products Section -->
        <div class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">Featured Products</h3>
                    <p class="text-muted small mb-0">Handpicked items just for you</p>
                </div>
                <a href="products.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">View All &rarr;</a>
            </div>
            <div id="homeProductList" class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading products...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function loadHomeProducts() {
            const list = document.getElementById('homeProductList');
            try {
                const products = await apiCall('/products');
                list.innerHTML = '';
                if (!products || products.length === 0) {
                    list.innerHTML = '<div class="col-12"><p class="text-muted">No products available at the moment.</p></div>';
                    return;
                }
                products.forEach(p => {
                    const imgUrl = getProductImage(p);
                    const categoryName = (p.category && p.category.name) ? p.category.name : 'Electronics';
                    const originalPrice = p.discount ? (p.price * (1 + p.discount / 100)).toFixed(2) : null;
                    
                    list.innerHTML += `
                    <div class="col-lg-4 col-md-6 mb-4">
                        <div class="card h-100 product-card shadow-sm border-0" data-testid="product-card">
                            <div class="product-img-wrapper">
                                <img src="${imgUrl}" alt="${p.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop&q=80'">
                                <span class="badge text-white badge-overlay badge-category">${categoryName}</span>
                                ${p.discount ? `<span class="badge badge-overlay badge-discount">-${p.discount}% OFF</span>` : ''}
                            </div>
                            <div class="card-body d-flex flex-column p-4">
                                <h5 class="card-title mb-2">${p.name}</h5>
                                <p class="card-text text-muted flex-grow-1 small mb-3">${p.description || ''}</p>
                                <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                                    <div>
                                        <span class="product-price">$${Number(p.price).toFixed(2)}</span>
                                        ${originalPrice ? `<span class="text-muted text-decoration-line-through small ms-2">$${originalPrice}</span>` : ''}
                                    </div>
                                    <button onclick="addToCart(${p.id})" class="btn btn-success btn-sm px-3 rounded-pill" data-testid="add-to-cart">
                                        <i class="bi bi-cart-plus me-1"></i> Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
            } catch (err) {
                console.error('Failed to load products:', err);
                list.innerHTML = '<div class="col-12"><div class="alert alert-warning">Could not load products. Please ensure the backend is running.</div></div>';
            }
        }

        async function addToCart(pid) {
            try {
                await apiCall('/cart/items', 'POST', { productId: pid, quantity: 1 });
                alert('Added to cart!');
            } catch (err) {
                alert('Please login first');
                window.location.href = 'login.html';
            }
        }

        loadHomeProducts();
    </script>
</body>
</html>
