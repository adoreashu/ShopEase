<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">ShopEase</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <!-- Dynamic auth links -->
                    <li class="nav-item"><a class="nav-link" href="login.html" data-testid="nav-login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html" data-testid="nav-register">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html" data-testid="nav-cart">Cart (<span id="cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="p-5 mb-4 bg-light rounded-3 text-center">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Welcome to ShopEase</h1>
                <p class="col-md-8 mx-auto fs-4">Find the best products at the best prices.</p>
                <a href="products.html" class="btn btn-primary btn-lg" data-testid="shop-now-btn">Shop Now</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
