<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">ShopEase</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <!-- Dynamic auth links -->
                    <li class="nav-item"><a class="nav-link" href="login.html" data-testid="nav-login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html" data-testid="nav-register">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html" data-testid="nav-cart">Cart (<span id="cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Hero Banner -->
        <div class="p-5 mb-5 bg-light rounded-3 text-center border">
            <div class="container-fluid py-4">
                <h1 class="display-5 fw-bold">Welcome to ShopEase</h1>
                <p class="col-md-8 mx-auto fs-5 text-muted">Find the best products at the best prices.</p>
                <a href="products.html" class="btn btn-primary btn-lg" data-testid="shop-now-btn">Shop All Products</a>
            </div>
        </div>

        <!-- Featured Products Section -->
        <div class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Featured Products</h3>
                <a href="products.html" class="text-decoration-none">View All &rarr;</a>
            </div>
            <div id="homeProductList" class="row">
                <div class="col-12 text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function loadHomeProducts() {
            const list = document.getElementById('homeProductList');
            try {
                const products = await apiCall('/products');
                list.innerHTML = '';
                if (!products || products.length === 0) {
                    list.innerHTML = '<div class="col-12"><p class="text-muted">No products available at the moment.</p></div>';
                    return;
                }
                products.forEach(p => {
                    list.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm" data-testid="product-card">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${p.name}</h5>
                                <p class="card-text text-muted flex-grow-1">${p.description || ''}</p>
                                <p class="card-text fw-bold text-primary fs-5">$${Number(p.price).toFixed(2)}</p>
                                <button onclick="addToCart(${p.id})" class="btn btn-success" data-testid="add-to-cart">Add to Cart</button>
                            </div>
                        </div>
                    </div>`;
                });
            } catch (err) {
                console.error('Failed to load products:', err);
                list.innerHTML = '<div class="col-12"><div class="alert alert-warning">Could not load products. Please ensure the backend is running.</div></div>';
            }
        }

        async function addToCart(pid) {
            try {
                await apiCall('/cart/items', 'POST', { productId: pid, quantity: 1 });
                alert('Added to cart!');
            } catch (err) {
                alert('Please login first');
                window.location.href = 'login.html';
            }
        }

        loadHomeProducts();
    </script>
</body>
</html>
