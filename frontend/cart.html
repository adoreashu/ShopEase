<!DOCTYPE html>
<html lang="en">
<head><title>Cart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div class="container mt-5">
        <h2>Cart</h2>
        <div id="cartList" class="mb-3"></div>
        <h4 data-testid="cart-total">Total: $<span id="total">0.00</span></h4>
        <a href="checkout.html" class="btn btn-primary" data-testid="checkout-button">Checkout</a>
    </div>
    <script src="js/api.js"></script>
    <script>
        async function loadCart() {
            try {
                const items = await apiCall('/cart');
                const list = document.getElementById('cartList');
                let total = 0;
                list.innerHTML = '';
                items.forEach(i => {
                    let itemTotal = i.product.price * i.quantity;
                    total += itemTotal;
                    list.innerHTML += <div>+i.product.name+ - Qty: +i.quantity+ - $+itemTotal+</div>;
                });
                document.getElementById('total').textContent = total.toFixed(2);
            } catch(err) { window.location.href='login.html'; }
        }
        loadCart();
    </script>
</body>
</html>
