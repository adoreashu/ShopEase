<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">ShopEase</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html" data-testid="nav-login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html" data-testid="nav-register">Register</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cart.html" data-testid="nav-cart">Cart</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Your Shopping Cart</h2>
        <div id="cartList" class="my-4"></div>
        <div class="d-flex justify-content-between align-items-center border-top pt-3">
            <h4 data-testid="cart-total">Total: $<span id="total">0.00</span></h4>
            <a href="checkout.html" class="btn btn-primary btn-lg" data-testid="checkout-button">Proceed to Checkout</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function loadCart() {
            try {
                const items = await apiCall('/cart');
                const list = document.getElementById('cartList');
                let total = 0;
                list.innerHTML = '';
                if (!items || items.length === 0) {
                    list.innerHTML = '<p class="text-muted">Your cart is currently empty. <a href="products.html">Browse products</a></p>';
                    document.getElementById('total').textContent = '0.00';
                    return;
                }
                items.forEach(i => {
                    let itemTotal = i.product.price * i.quantity;
                    total += itemTotal;
                    list.innerHTML += `
                    <div class="card mb-2">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title mb-1">${i.product.name}</h5>
                                <span class="text-muted">Qty: ${i.quantity} &times; $${Number(i.product.price).toFixed(2)}</span>
                            </div>
                            <span class="fw-bold">$${Number(itemTotal).toFixed(2)}</span>
                        </div>
                    </div>`;
                });
                document.getElementById('total').textContent = total.toFixed(2);
            } catch(err) {
                console.error('Cart load error:', err);
                window.location.href = 'login.html';
            }
        }
        loadCart();
    </script>
</body>
</html>
