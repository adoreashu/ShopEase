<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">ShopEase</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html" data-testid="nav-login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html" data-testid="nav-register">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html" data-testid="nav-cart">Cart (<span id="cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h2 class="fw-bold mb-1">Product Catalog</h2>
                <p class="text-muted small mb-0">Browse all available tech gear and gadgets</p>
            </div>
            <div style="max-width: 360px; width: 100%;">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="search" class="form-control border-start-0 ps-0" placeholder="Search products...">
                </div>
            </div>
        </div>
        <div id="productList" class="row">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading products...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function loadProducts(q = '') {
            try {
                const url = q ? '/products/search?q=' + encodeURIComponent(q) : '/products';
                const products = await apiCall(url);
                const list = document.getElementById('productList');
                list.innerHTML = '';
                if (!products || products.length === 0) {
                    list.innerHTML = '<div class="col-12 py-5 text-center"><p class="text-muted fs-5">No products found matching your search.</p></div>';
                    return;
                }
                products.forEach(p => {
                    const imgUrl = getProductImage(p);
                    const categoryName = (p.category && p.category.name) ? p.category.name : 'Electronics';
                    const originalPrice = p.discount ? (p.price * (1 + p.discount / 100)).toFixed(2) : null;

                    list.innerHTML += `
                    <div class="col-lg-4 col-md-6 mb-4">
                        <div class="card h-100 product-card shadow-sm border-0" data-testid="product-card">
                            <div class="product-img-wrapper">
                                <img src="${imgUrl}" alt="${p.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop&q=80'">
                                <span class="badge text-white badge-overlay badge-category">${categoryName}</span>
                                ${p.discount ? `<span class="badge badge-overlay badge-discount">-${p.discount}% OFF</span>` : ''}
                            </div>
                            <div class="card-body d-flex flex-column p-4">
                                <h5 class="card-title mb-2">${p.name}</h5>
                                <p class="card-text text-muted flex-grow-1 small mb-3">${p.description || ''}</p>
                                <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                                    <div>
                                        <span class="product-price">$${Number(p.price).toFixed(2)}</span>
                                        ${originalPrice ? `<span class="text-muted text-decoration-line-through small ms-2">$${originalPrice}</span>` : ''}
                                    </div>
                                    <button onclick="addToCart(${p.id})" class="btn btn-success btn-sm px-3 rounded-pill" data-testid="add-to-cart">
                                        <i class="bi bi-cart-plus me-1"></i> Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
            } catch (err) {
                console.error('Error loading products:', err);
                document.getElementById('productList').innerHTML = '<div class="col-12"><div class="alert alert-danger">Failed to load products from server. Make sure backend is running.</div></div>';
            }
        }

        async function addToCart(pid) {
            try {
                await apiCall('/cart/items', 'POST', { productId: pid, quantity: 1 });
                alert('Added to cart!');
            } catch (err) {
                alert('Please login first');
                window.location.href = 'login.html';
            }
        }

        document.getElementById('search').addEventListener('input', (e) => loadProducts(e.target.value));
        loadProducts();
    </script>
</body>
</html>
