<!DOCTYPE html>
<html lang="en">
<head><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div class="container mt-5" style="max-width: 400px;">
        <h2>Register</h2>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
        <form id="regForm">
            <div class="mb-3"><label>First Name</label><input type="text" id="firstName" class="form-control" required></div>
            <div class="mb-3"><label>Last Name</label><input type="text" id="lastName" class="form-control" required></div>
            <div class="mb-3"><label>Email</label><input type="email" id="email" class="form-control" required></div>
            <div class="mb-3"><label>Phone</label><input type="text" id="phone" class="form-control" required></div>
            <div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control" required></div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };
            try {
                await apiCall('/auth/register', 'POST', data);
                window.location.href = 'login.html';
            } catch (err) {
                document.getElementById('errorMsg').textContent = err.message;
                document.getElementById('errorMsg').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
