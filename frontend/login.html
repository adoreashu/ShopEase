<!DOCTYPE html>
<html lang="en">
<head><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div class="container mt-5" style="max-width: 400px;">
        <h2>Login</h2>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
        <form id="loginForm">
            <div class="mb-3"><label>Email</label><input type="email" id="email" class="form-control" data-testid="login-email" required></div>
            <div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control" data-testid="login-password" required></div>
            <button type="submit" class="btn btn-primary" data-testid="login-button">Login</button>
        </form>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await apiCall('/auth/login', 'POST', { email, password });
                localStorage.setItem('token', res.token);
                window.location.href = 'index.html';
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Invalid login credentials';
                document.getElementById('errorMsg').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
