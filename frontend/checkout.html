<!DOCTYPE html>
<html lang="en">
<head><title>Checkout</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div class="container mt-5">
        <h2>Checkout</h2>
        <form id="checkoutForm">
            <input type="text" id="fullName" class="form-control mb-2" placeholder="Full Name" required>
            <input type="text" id="phone" class="form-control mb-2" placeholder="Phone" required>
            <input type="text" id="address" class="form-control mb-2" placeholder="Address" required>
            <input type="text" id="city" class="form-control mb-2" placeholder="City" required>
            <input type="text" id="state" class="form-control mb-2" placeholder="State" required>
            <input type="text" id="zip" class="form-control mb-2" placeholder="Zip" required>
            <input type="text" id="country" class="form-control mb-2" placeholder="Country" required>
            <select id="payment" class="form-control mb-3"><option>Credit Card</option><option>UPI</option></select>
            <button type="submit" class="btn btn-success" data-testid="place-order-btn">Place Order</button>
        </form>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                addressLine: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                postalCode: document.getElementById('zip').value,
                country: document.getElementById('country').value
            };
            try {
                await apiCall('/orders', 'POST', data);
                alert('Order Placed Successfully!');
                window.location.href = 'index.html';
            } catch(err) { alert(err.message); }
        });
    </script>
</body>
</html>
